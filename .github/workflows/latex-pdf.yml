name: Build LaTeX PDFs

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/examples/exports/**/*.tex'
      - '.github/workflows/latex-pdf.yml'

permissions:
  contents: write

jobs:
  latex-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set reproducible timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 'docs/examples/exports/**/capture.tex'
          work_in_root_file_dir: true

      - name: Commit generated PDFs to the PR branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/examples/exports/**/capture.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build example LaTeX captures to PDF [skip ci]"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
